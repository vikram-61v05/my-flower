    PX[i] += NOISE[(i * 7 + off) & (NOISE_N - 1)]; PY[i] += NOISE[(i * 13 + off + 12345) & (NOISE_N - 1)];
    let bk = ((PZ[i] - ZMIN) * 2) | 0; bk = bk < 0 ? 0 : bk >= NB ? NB - 1 : bk; BUCKET[i] = bk; cnt[bk + 1]++;
  }
  for (let i = 0; i < NB; i++) cnt[i + 1] += cnt[i];
  for (let i = 0; i < nPts; i++) ORDER[cnt[BUCKET[i]]++] = i;
  for (let q = 0; q < nPts; q++) {
    const i = ORDER[q], xi = Math.round(PX[i]), yi = Math.round(PY[i]);
    if (xi < 0 || xi >= W - 1 || yi < 0 || yi >= H - 1) continue;
    put(xi, yi, PR[i], PG[i], PBc[i]);
  }
  for (let q = 0; q < nPts; q++) {
    const i = ORDER[q]; if (!PBOLD[i]) continue;
    const xi = Math.round(PX[i]), yi = Math.round(PY[i]);
    if (xi < 0 || xi >= W - 1 || yi < 0 || yi >= H - 1) continue;
    put(xi + 1, yi, PR[i], PG[i], PBc[i]); put(xi, yi + 1, PR[i], PG[i], PBc[i]);
  }
  snowStep(a); drawFlakes();

  // glow = 0.5 * blur6 + 0.95 * blur20, built on the small grid, upscaled by the browser
  const gd = glowImg.data;
  for (let gy = 0; gy < GH6; gy++) {
    const ya = UPY.i0[gy] * GW20, yb = UPY.i1[gy] * GW20, wy = UPY.w[gy];
    for (let gx = 0; gx < GW6; gx++) {
      const xa = UPX.i0[gx], xb = UPX.i1[gx], wx = UPX.w[gx], p6 = (gy * GW6 + gx) * 3;
      for (let c = 0; c < 3; c++) {
        const a00 = B20[(ya + xa) * 3 + c], a10 = B20[(ya + xb) * 3 + c], a01 = B20[(yb + xa) * 3 + c], a11 = B20[(yb + xb) * 3 + c];
        const g20 = ((a00 * (1 - wx) + a10 * wx) * (1 - wy) + (a01 * (1 - wx) + a11 * wx) * wy) / 400;
        gd[(gy * GW6 + gx) * 4 + c] = B6[p6 + c] / 36 * 0.5 + g20 * 0.95;
      }
      gd[(gy * GW6 + gx) * 4 + 3] = 255;
    }
  }
  glowCtx.putImageData(glowImg, 0, 0);

  // rings and background stars are drawn after (so they do not glow)
  ringLayer(a);
  for (let i = 0; i < NSTAR; i++) {
    const tw = 0.6 + 0.4 * Math.sin(a * 1.7 + starP[i]), k = starB[i] * tw;
    addNoGlow(starX[i], starY[i], 190 * k, 200 * k, 255 * k);
  }
  layerCtx.putImageData(layerImg, 0, 0);

  // bottom patch (love message + gift box)
  const fade = tapAt === null ? 0 : smooth(a - tapAt, LOVE_REVEAL[0], LOVE_REVEAL[1]);
  const patchOn = fade >= 0.01 || smooth(a, GIFT_SHOW[0], GIFT_SHOW[1]) >= 0.01;
  if (patchOn) { Mp.fill(1); Ap.fill(0); drawLove(a, fade); drawGift(a); }

  ctx.globalCompositeOperation = "source-over"; ctx.globalAlpha = 1; ctx.imageSmoothingEnabled = false;
  ctx.drawImage(bgCv, 0, 0);
  ctx.globalCompositeOperation = "lighter";
  ctx.drawImage(layerCv, 0, 0);
  ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = "low";
  ctx.drawImage(glowCv, 0, 0, W, H);
  if (patchOn) {
    const da = patchImgA.data, db = patchImgB.data;
    for (let i = 0; i < BW * BH; i++) {
      da[i * 4] = 0; da[i * 4 + 1] = 0; da[i * 4 + 2] = 0; da[i * 4 + 3] = (1 - clamp(Mp[i], 0, 1)) * 255;
      const A0 = Ap[i * 3], A1 = Ap[i * 3 + 1], A2 = Ap[i * 3 + 2];
      db[i * 4] = A0 > 255 ? 255 : A0 < 0 ? 0 : A0; db[i * 4 + 1] = A1 > 255 ? 255 : A1 < 0 ? 0 : A1; db[i * 4 + 2] = A2 > 255 ? 255 : A2 < 0 ? 0 : A2; db[i * 4 + 3] = 255;
    }
    patchCtxA.putImageData(patchImgA, 0, 0); patchCtxB.putImageData(patchImgB, 0, 0);
    ctx.imageSmoothingEnabled = false;
    ctx.globalCompositeOperation = "source-over"; ctx.drawImage(patchCvA, BX0, BY0);
    ctx.globalCompositeOperation = "lighter"; ctx.drawImage(patchCvB, BX0, BY0);
  }
  ctx.globalCompositeOperation = "source-over";
  drawSig(a);
}

// ---- main loop + interaction -------------------------------------------------
let now = 0, last = null, paused = false;
function frame(ts) {
  if (!paused) { if (last !== null) now += Math.min((ts - last) / 1000, 0.1); last = ts; render(now); }
  else last = ts;
  requestAnimationFrame(frame);
}
function tryTap() { if (tapAt === null && now >= GIFT_SHOW[0] + 0.8) tapAt = now; }
function restart() { now = 0; tapAt = null; flakes = []; snowT = 0; spawnAcc = 0; }
window.addEventListener("pointerdown", tryTap);
window.addEventListener("keydown", e => {
  if (e.code === "Space" || e.code === "Enter") { e.preventDefault(); tryTap(); }
  else if (e.key === "r" || e.key === "R") restart();
});
// small hook used for testing: jump to a time (and optionally pretend a tap happened)
window.lilySeek = (a, tap) => { paused = true; restart(); const T = (tap === undefined) ? null : tap; for (let t = 0; t < a; t += 1 / 30) { tapAt = (T !== null && t >= T) ? T : null; now = t; render(t); } tapAt = (T !== null && a >= T) ? T : null; now = a; render(a); };
requestAnimationFrame(frame);
})();
</script>
